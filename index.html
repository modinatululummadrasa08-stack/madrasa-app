<script>
/* =====================================================
   BANNER MODAL & INFO
===================================================== */
function openBannerModal(){
    const modal = document.getElementById('bannerModal');
    if(!modal) return;
    
    modal.classList.remove('hidden');
    modal.classList.add('flex');

    const saved = JSON.parse(localStorage.getItem('madrasaBannerData') || '{}');

    if(document.getElementById('input-name')) 
        document.getElementById('input-name').value = saved.name || document.getElementById('disp-name').innerText;
    if(document.getElementById('input-tagline')) 
        document.getElementById('input-tagline').value = saved.tagline || document.getElementById('disp-tagline').innerText;
    if(document.getElementById('input-estd')) 
        document.getElementById('input-estd').value = saved.estd || document.getElementById('disp-estd').innerText;
    if(document.getElementById('input-address')) 
        document.getElementById('input-address').value = saved.address || document.getElementById('disp-address').innerText;
    if(document.getElementById('input-phone')) 
        document.getElementById('input-phone').value = saved.phone || document.getElementById('disp-phone').innerText;
}


function closeBannerModal(){
    const modal = document.getElementById('bannerModal');
    if(!modal) return;

    modal.classList.add('hidden');
    modal.classList.remove('flex');
}


function saveBannerInfo(e){
    e.preventDefault();

    const fileInput = document.getElementById('input-logo-file');
    const file = fileInput ? fileInput.files[0] : null;

    const oldData = JSON.parse(localStorage.getItem('madrasaBannerData') || '{}');

    const save = (logo) => {
        const data = {
            name: document.getElementById('input-name').value,
            tagline: document.getElementById('input-tagline').value,
            estd: document.getElementById('input-estd').value,
            address: document.getElementById('input-address').value,
            phone: document.getElementById('input-phone').value,
            logo: logo || oldData.logo || ''
        };

        localStorage.setItem('madrasaBannerData', JSON.stringify(data));

        loadBannerInfo();
        closeBannerModal();
        alert("ব্যানার সফলভাবে আপডেট হয়েছে!");
    };

    if(file){
        const reader = new FileReader();
        reader.onload = (ev) => save(ev.target.result);
        reader.readAsDataURL(file);
    } else {
        save(null);
    }
}


function loadBannerInfo(){
    const saved = JSON.parse(localStorage.getItem('madrasaBannerData') || '{}');
    if(!saved) return;

    if(saved.name && document.getElementById('disp-name'))
        document.getElementById('disp-name').innerText = saved.name;

    if(saved.tagline && document.getElementById('disp-tagline'))
        document.getElementById('disp-tagline').innerText = saved.tagline;

    if(saved.estd && document.getElementById('disp-estd'))
        document.getElementById('disp-estd').innerText = saved.estd;

    if(saved.address && document.getElementById('disp-address'))
        document.getElementById('disp-address').innerText = saved.address;

    if(saved.phone && document.getElementById('disp-phone'))
        document.getElementById('disp-phone').innerText = saved.phone;

    if(saved.logo){
        const icon = document.getElementById('bannerLogoIcon');
        if(icon) icon.classList.add('hidden');

        const img = document.getElementById('bannerLogoImg');
        if(img) {
            img.src = saved.logo;
            img.classList.remove('hidden');
        }
    }
}


/* =====================================================
   SIDEBAR LOGO
===================================================== */
function updateSidebarLogo(event){
    const file = event.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        localStorage.setItem('madrasaCustomLogo', e.target.result);
        applySidebarLogo(e.target.result);
    };
    reader.readAsDataURL(file);
}


function applySidebarLogo(src){
    const icon = document.getElementById('sidebarLogoIcon');
    if(icon) icon.classList.add('hidden');

    const img = document.getElementById('sidebarLogoImg');
    if(img) {
        img.src = src;
        img.classList.remove('hidden');
    }
}


/* =====================================================
   ADMIN
===================================================== */
function openAdminModal(){
    const modal = document.getElementById('adminModal');
    if(!modal) return;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}


function closeAdminModal(){
    const modal = document.getElementById('adminModal');
    if(!modal) return;
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}


function factoryReset(){
    if(confirm("Local Storage পরিষ্কার করতে চান?\nFirebase-এর ডাটা মুছে যাবে না।")){
        localStorage.clear();
        location.reload();
    }
}


/* =====================================================
   ID CARD
===================================================== */
function generateIdCard(){
    alert("ID Card Generator-এর ডিজাইন প্রস্তুত করা হয়েছে।\nপরবর্তী ধাপে ছাত্রের তথ্য দিয়ে স্বয়ংক্রিয় প্রিন্ট বা PDF যুক্ত করা যাবে।");
}


/* =====================================================
   HELPERS
===================================================== */
function formatMoney(amount){
    return Number(amount || 0).toLocaleString('bn-BD') + " টাকা";
}


function toBanglaNumber(number){
    return Number(number || 0).toLocaleString('bn-BD');
}


function escapeHTML(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   INITIAL LOAD
===================================================== */
window.onload = function(){
    // অটোমেটিক ক্যালেন্ডার সচল করা (যদি ফাংশনটি থেকে থাকে)
    if(typeof scheduleMidnightCalendarUpdate === 'function') {
        scheduleMidnightCalendarUpdate();
    }

    loadBannerInfo();

    const logo = localStorage.getItem('madrasaCustomLogo');
    if(logo){
        applySidebarLogo(logo);
    }

    if(typeof updateDashboardStats === 'function') updateDashboardStats();
    if(typeof loadAttendanceStats === 'function') loadAttendanceStats();
    if(typeof loadStudentsTable === 'function') loadStudentsTable();
};


// Firebase Auth Check (যদি auth অবজেক্ট থাকে)
if(typeof auth !== 'undefined') {
    auth.onAuthStateChanged(function(user){
        if(user){
            console.log("✅ Firebase Auth Ready");
            console.log("Logged in:", user.email);
        } else {
            console.log("⚠️ Not Logged In");
        }
    });
}
</script>
